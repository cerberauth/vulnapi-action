name: 'VulnAPI Action'
description:
  'VulnAPI is an open-source project designed to help you scan your APIs for
  common security vulnerabilities and weaknesses.'
author: 'CerberAuth'
branding:
  icon: 'shield'
  color: 'gray-dark'

inputs:
  token:
    description: 'GitHub token used to authenticate with the GitHub API'
    required: false
    default: ${{ github.token }}

  version:
    description: 'The version of the VulnAPI to use'
    required: true
    default: 'latest'

  curl:
    description: 'The curl command used to run API vulnerability scans'
    required: false

  openapi:
    description: 'The OpenAPI file used to run API vulnerability scans'
    required: false

  scans:
    description: 'The scans performed'
    required: false

  excludeScans:
    description: 'The scans to exclude'
    required: false

  rateLimit:
    description: 'The rate limit used to run API vulnerability scans'
    required: false

  telemetry:
    description:
      'VulnAPI uses fully anonymized telemetry data to help improve the tool.
      You can disable it by setting this to false.'
    required: false
    default: 'true'

  proxy:
    description: 'The proxy server used during the scan'
    required: false

  severityThreshold:
    description: 'The severity threshold to trigger a failure'
    required: false

  comment:
    description:
      'When the workflow runs for a pull request, post (or update) a PR comment
      summarizing every finding. Requires the token to have pull-requests: write
      permission; without it a warning is logged instead. The step still fails
      when findings reach the severity threshold. Set to false to disable.'
    required: false
    default: 'true'

  scan-id:
    description:
      'Distinguishes the PR comments of several scans run on the same pull
      request (e.g. one per target or matrix job), so each keeps its own comment
      instead of overwriting the others.'
    required: false
    default: ''

  output-format:
    description:
      'Write the full report to a file in this format: json, yaml, jsonl, sarif,
      markdown, html or terminal. The file path is exposed as the report-path
      output (e.g. to upload as an artifact or feed sarif to
      github/codeql-action/upload-sarif).'
    required: false
    default: ''

  output-path:
    description:
      'File path for output-format. Defaults to a generated path under
      RUNNER_TEMP.'
    required: false
    default: ''

  report-url:
    description: 'HTTP endpoint to POST the full report to.'
    required: false
    default: ''

  report-format:
    description:
      'Format for report-url: json, yaml, jsonl, sarif, markdown, html.'
    required: false
    default: ''

  report-headers:
    description:
      'Extra HTTP headers for report-url, one "Key: Value" (or "Key=Value") pair
      per line, e.g. for an authorization token.'
    required: false
    default: ''

  show-all-findings:
    description:
      'Show every finding in the terminal output, not only the ones at or above
      the severity threshold. Report files, report-url and the PR comment always
      include every finding.'
    required: false
    default: 'false'

  no-color:
    description: 'Disable ANSI colors in terminal output.'
    required: false
    default: 'false'

  quiet:
    description: 'Suppress the terminal display of the report.'
    required: false
    default: 'false'

outputs:
  report-path:
    description:
      'Path of the report file written for output-format/output-path, if any.'

runs:
  using: node24
  main: dist/index.js
